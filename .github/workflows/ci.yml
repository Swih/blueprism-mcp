name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    # Blue Prism only runs on Windows: keep the toolchain honest there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
